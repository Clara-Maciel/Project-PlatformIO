<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP8266 Dados</title>
  <style>
    /* CSS Mínimo: Apenas para centralizar e melhorar a fonte */
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #222;
      color: #fff;
    }
    h1 { margin-bottom: 30px; color: #a0f; }
    ul { list-style: none; padding: 0; max-width: 400px; margin: 0 auto; }
    li {
      background-color: #333;
      margin-bottom: 10px;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: space-between;
      font-size: 1.1em;
    }
    .label { font-weight: bold; }
    .valor { color: #0f0; }
  </style>
</head>
<body>
  <h1>Painel IoT</h1>
  
  <ul>
    <li>
      <span class="label">Temperatura:</span>
      <span class="valor" id="temp">-- °C</span>
    </li>
    <li>
      <span class="label">Umidade:</span>
      <span class="valor" id="umid">-- %</span>
    </li>
    <li>
      <span class="label">Distância:</span>
      <span class="valor" id="dist">-- cm</span>
    </li>
  </ul>

</body>
  <script>
    async function atualizar() {
      try {
        const resposta = await fetch('/dados');
        const dados = await resposta.json();
        
        document.getElementById('temp').textContent = dados.temperatura + " °C";
        document.getElementById('umid').textContent = dados.umidade + " %";
        document.getElementById('dist').textContent = dados.distancia + " cm";
      } catch (e) {
        console.error("Erro ao atualizar:", e);
        document.getElementById('temp').textContent = "ERRO";
        document.getElementById('umid').textContent = "ERRO";
        document.getElementById('dist').textContent = "ERRO";
      }
    }
    setInterval(atualizar, 2000);
    atualizar();
  </script>
</body>
</html>
